# Release and recovery: https://github.com/nlibjs/actions#release-procedure
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      action:
        description: Operation
        type: choice
        options: [verify, stage]
        default: verify
        required: true
      tag:
        description: "Published Release tag for retry, e.g. v1.2.3"
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  Verify:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
    permissions:
      contents: read
    uses: nlibjs/actions/.github/workflows/npm-release.yml@REPLACE_WITH_COMMON_WORKFLOW_SHA
    with:
      action: verify
  Stage:
    if: (github.event_name == 'release' && !github.event.release.prerelease) || inputs.action == 'stage'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: nlibjs/actions/.github/workflows/npm-release.yml@REPLACE_WITH_COMMON_WORKFLOW_SHA
    with:
      action: stage
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      # environment: deployment
  PublishJsr:
    needs: Stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          package-manager-cache: false
      # For callers using Deno:
      # - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
      #   with:
      #     deno-version: v2.x
      - run: npm ci
      - run: npx --yes jsr@0.14.3 publish
