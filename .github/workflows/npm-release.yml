name: Shared npm release
on:
  workflow_call:
    inputs:
      action:
        type: string
        default: "verify"
      tag:
        type: string
        default: ""
      environment:
        type: string
        default: ""
      cleanup-source:
        type: string
        default: "registry"
# Publishing jobs inherit caller permissions, including on skipped branches.
jobs:
  Verify:
    if: inputs.action != 'stage'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - id: release
        uses: nlibjs/actions/actions/npm-release@fb8c1ebe8e807f896242c67e6dc407c71e4e34dd
        with:
          action: ${{ inputs.action }}
          tag: ${{ inputs.tag }}
          cleanup-source: ${{ inputs.cleanup-source }}
        env:
          GH_TOKEN: ${{ github.token }}
  Stage:
    name: Stage ${{ inputs.tag }}
    if: inputs.action == 'stage'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.0
      - id: release
        uses: nlibjs/actions/actions/npm-release@fb8c1ebe8e807f896242c67e6dc407c71e4e34dd
        with:
          action: ${{ inputs.action }}
          tag: ${{ inputs.tag }}
          cleanup-source: ${{ inputs.cleanup-source }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Persist npm submission evidence
        if: steps.release.outputs.submit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          path: ${{ runner.temp }}/npm-evidence/evidence.json
          if-no-files-found: error
          retention-days: 0
      - name: Submit npm tarball
        id: submit
        if: steps.release.outputs.submit == 'true'
        uses: nlibjs/actions/actions/npm-release@fb8c1ebe8e807f896242c67e6dc407c71e4e34dd
        with:
          action: stage
          phase: submit
          tag: ${{ inputs.tag }}
          tarball: ${{ steps.release.outputs.tarball }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Persist npm staging result
        if: always() && steps.submit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}-result
          path: ${{ runner.temp }}/npm-evidence/evidence.json
          if-no-files-found: error
          retention-days: 0
