name: Validate shared workflows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # These reusable calls are parsed by GitHub but never run on the configured
  # push/pull_request events. Contract checks keep workflow_dispatch disabled.
  VerifyPermissionContract:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/npm-release.yml
    with:
      action: verify
  StagePermissionContract:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/npm-release.yml
    with:
      action: stage
      tag: v1.2.3
  Validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix actions/npm-release --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check
